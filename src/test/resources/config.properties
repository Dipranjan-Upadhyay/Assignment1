# Flipkart automation config
# any value can be overridden while running, eg: mvn test -Dlogin.mobile=9xxxxxxxxx
# env variables also work (LOGIN_MOBILE, BROWSER_NAME etc). order is: command line > env variable > this file

app.url=https://www.flipkart.com

# chrome / edge / firefox
browser.name=chrome
browser.headless=false
browser.maximize=true

# dummy test data, pass the real number from command line.
# on github actions these are picked from secrets (LOGIN_MOBILE, LOGIN_OTP)
login.mobile=9876543210
login.otp=123456

# waits (in seconds)
# implicit wait is kept 0 because explicit waits are used, using both together gives random timeouts
wait.implicit=0
wait.explicit=15
wait.popup=10
wait.pageLoad=40

retry.count=1
screenshot.on.failure=true

report.title=Flipkart Automation Report
report.name=Flipkart Login Flow
